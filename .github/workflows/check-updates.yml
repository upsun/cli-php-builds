name: Check for updates

# Rebuilds the latest release when PHP or any library in it has a new upstream
# release.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with build-php.yml.
  SPC_VERSION: '2.8.5'
  # SHA-256 of spc-linux-x86_64.tar.gz in the SPC_VERSION release.
  SPC_LINUX_X86_64_SHA256: '523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5'

jobs:
  check:
    name: Check sources
    runs-on: ubuntu-latest
    outputs:
      php_version: ${{ steps.check.outputs.php_version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Download static-php-cli
        run: |
          build_spc_version=$(yq '.env.SPC_VERSION' .github/workflows/build-php.yml)
          if [[ "$build_spc_version" != "$SPC_VERSION" ]]; then
            echo "SPC_VERSION differs from build-php.yml ($build_spc_version)" >&2
            exit 1
          fi
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-linux-x86_64.tar.gz"
          echo "${SPC_LINUX_X86_64_SHA256}  spc.tar.gz" | sha256sum -c
          tar -xzf spc.tar.gz spc

      - name: Compare sources with the latest release
        id: check
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(scripts/latest-release.sh)
          changes=$(scripts/check-sources.sh ./spc "$tag")
          if [[ -z "$changes" ]]; then
            echo "$tag is up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit
          fi
          {
            echo "Rebuilding $tag:"
            echo
            echo "$changes" | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "php_version=$(echo "$tag" | sed -E 's/^php-([0-9]+\.[0-9]+)\..*/\1/')" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: ${{ needs.check.outputs.php_version }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-php.yml
    with:
      php_version: ${{ needs.check.outputs.php_version }}
      create_release: true

  report-failure:
    name: Report failure
    needs: [check, build]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automatic PHP build failed"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled update check or build failed: $RUN_URL"
          fi
