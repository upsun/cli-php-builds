name: Build PHP

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (X.Y.Z, or X.Y to resolve to the latest patch). Defaults to the minor version of the latest release.'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub release with the binaries'
        required: true
        default: true
        type: boolean
      debug:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      php_version:
        type: string
        required: true
      create_release:
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

env:
  SPC_VERSION: '2.8.5'
  # SHA-256 of spc-macos-x86_64.tar.gz in the SPC_VERSION release.
  SPC_MACOS_X86_64_SHA256: 'e8b798048f62ca4960764196543b60ae703f7174aa418824cf542aeec1d2cd6a'
  EXTENSIONS: 'curl,filter,openssl,pcntl,phar,posix,readline,zlib'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Resolve a minor version (e.g. 8.4) to the latest patch version (e.g. 8.4.20)
  # so all artifact names and the release tag include the full X.Y.Z.
  resolve-version:
    name: Resolve PHP version
    runs-on: ubuntu-latest
    outputs:
      php_version: ${{ steps.resolve.outputs.php_version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Resolve to latest patch version
        id: resolve
        env:
          GH_REPO: ${{ github.repository }}
          INPUT_PHP_VERSION: ${{ inputs.php_version }}
        run: |
          input="$INPUT_PHP_VERSION"
          if [[ -z "$input" ]]; then
            input=$(scripts/latest-release.sh | sed -E 's/^php-([0-9]+\.[0-9]+)\..*/\1/')
          fi
          if [[ "$input" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            resolved="$input"
          elif [[ "$input" =~ ^[0-9]+\.[0-9]+$ ]]; then
            resolved=$(curl -fsSL "https://www.php.net/releases/?json&version=$input" | jq -er .version)
          else
            echo "Invalid PHP version: $input (expected X.Y or X.Y.Z)" >&2
            exit 1
          fi
          echo "Resolved PHP version: $resolved"
          echo "php_version=$resolved" >> "$GITHUB_OUTPUT"

  # Linux x86_64 build using Docker
  build-linux-amd64:
    name: Linux x86_64
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Clone static-php-cli
        run: |
          git clone --depth 1 --branch ${{ env.SPC_VERSION }} https://github.com/crazywhalecc/static-php-cli.git spc

      - name: Build PHP in Docker
        run: |
          cd spc
          SPC_USE_ARCH=x86_64 ./bin/spc-alpine-docker download \
            --with-php=${{ needs.resolve-version.outputs.php_version }} \
            --for-extensions="$EXTENSIONS" \
            --without-suggestions --no-alt \
            ${{ inputs.debug && '--debug' || '' }}
          SPC_USE_ARCH=x86_64 ./bin/spc-alpine-docker build \
            "$EXTENSIONS" \
            --build-cli \
            ${{ inputs.debug && '--debug' || '' }}

      # Collects the binary, and the version of each source in the build,
      # which check-updates.yml compares with the latest upstream versions.
      # On Linux, Docker creates the build directory as root.
      - name: Collect build output
        shell: bash
        run: |
          mkdir out
          cp spc/buildroot/bin/php out/
          jq 'with_entries(select(.value.lock_as == 1 and .value.source_type == "archive" and .key != "frankenphp") | .value = .value.filename)' \
            spc/downloads/.lock.json | tee out/sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ needs.resolve-version.outputs.php_version }}-linux-amd64
          path: out/
          retention-days: 1

  # Linux ARM64 build using native ARM runner
  build-linux-arm64:
    name: Linux ARM64
    needs: resolve-version
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone static-php-cli
        run: |
          git clone --depth 1 --branch ${{ env.SPC_VERSION }} https://github.com/crazywhalecc/static-php-cli.git spc

      - name: Build PHP in Docker
        run: |
          cd spc
          SPC_USE_ARCH=aarch64 ./bin/spc-alpine-docker download \
            --with-php=${{ needs.resolve-version.outputs.php_version }} \
            --for-extensions="$EXTENSIONS" \
            --without-suggestions --no-alt \
            ${{ inputs.debug && '--debug' || '' }}
          SPC_USE_ARCH=aarch64 ./bin/spc-alpine-docker build \
            "$EXTENSIONS" \
            --build-cli \
            ${{ inputs.debug && '--debug' || '' }}

      # Collects the binary, and the version of each source in the build,
      # which check-updates.yml compares with the latest upstream versions.
      # On Linux, Docker creates the build directory as root.
      - name: Collect build output
        shell: bash
        run: |
          mkdir out
          cp spc/buildroot/bin/php out/
          jq 'with_entries(select(.value.lock_as == 1 and .value.source_type == "archive" and .key != "frankenphp") | .value = .value.filename)' \
            spc/downloads/.lock.json | tee out/sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ needs.resolve-version.outputs.php_version }}-linux-arm64
          path: out/
          retention-days: 1

  # macOS ARM64 (Apple Silicon) build
  build-macos-arm64:
    name: macOS ARM64
    needs: resolve-version
    runs-on: macos-15
    steps:
      - name: Clone static-php-cli
        run: |
          git clone --depth 1 --branch ${{ env.SPC_VERSION }} https://github.com/crazywhalecc/static-php-cli.git spc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: curl, openssl, mbstring

      - name: Install dependencies
        run: |
          cd spc
          composer install --no-dev --classmap-authoritative

      - name: Setup build environment
        run: |
          cd spc
          ./bin/spc doctor --auto-fix

      - name: Download sources
        run: |
          cd spc
          ./bin/spc download \
            --with-php=${{ needs.resolve-version.outputs.php_version }} \
            --for-extensions="$EXTENSIONS" \
            --without-suggestions --no-alt \
            ${{ inputs.debug && '--debug' || '' }}

      - name: Build PHP
        run: |
          cd spc
          ./bin/spc build \
            "$EXTENSIONS" \
            --build-cli \
            ${{ inputs.debug && '--debug' || '' }}

      # Collects the binary, and the version of each source in the build,
      # which check-updates.yml compares with the latest upstream versions.
      # On Linux, Docker creates the build directory as root.
      - name: Collect build output
        shell: bash
        run: |
          mkdir out
          cp spc/buildroot/bin/php out/
          jq 'with_entries(select(.value.lock_as == 1 and .value.source_type == "archive" and .key != "frankenphp") | .value = .value.filename)' \
            spc/downloads/.lock.json | tee out/sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ needs.resolve-version.outputs.php_version }}-darwin-arm64
          path: out/
          retention-days: 1

  # macOS x86_64 (Intel) build
  # Uses the standalone spc binary, as setup-php no longer supports Intel macOS
  # runners (Homebrew dropped them).
  # See: https://github.com/shivammathur/setup-php/issues/1112
  build-macos-amd64:
    name: macOS x86_64
    needs: resolve-version
    runs-on: macos-15-intel
    steps:
      - name: Download static-php-cli
        run: |
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${{ env.SPC_VERSION }}/spc-macos-x86_64.tar.gz"
          echo "${{ env.SPC_MACOS_X86_64_SHA256 }}  spc.tar.gz" | shasum -a 256 -c
          mkdir -p spc/bin
          tar -xzf spc.tar.gz -C spc/bin
          spc/bin/spc --version

      - name: Setup build environment
        run: |
          cd spc
          ./bin/spc doctor --auto-fix

      - name: Download sources
        run: |
          cd spc
          ./bin/spc download \
            --with-php=${{ needs.resolve-version.outputs.php_version }} \
            --for-extensions="$EXTENSIONS" \
            --without-suggestions --no-alt \
            ${{ inputs.debug && '--debug' || '' }}

      - name: Build PHP
        run: |
          cd spc
          ./bin/spc build \
            "$EXTENSIONS" \
            --build-cli \
            ${{ inputs.debug && '--debug' || '' }}

      # Collects the binary, and the version of each source in the build,
      # which check-updates.yml compares with the latest upstream versions.
      # On Linux, Docker creates the build directory as root.
      - name: Collect build output
        shell: bash
        run: |
          mkdir out
          cp spc/buildroot/bin/php out/
          jq 'with_entries(select(.value.lock_as == 1 and .value.source_type == "archive" and .key != "frankenphp") | .value = .value.filename)' \
            spc/downloads/.lock.json | tee out/sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ needs.resolve-version.outputs.php_version }}-darwin-amd64
          path: out/
          retention-days: 1

  # Windows x64 build
  build-windows-amd64:
    name: Windows x64
    needs: resolve-version
    # Not windows-latest or windows-2025: those images now ship Visual Studio
    # 2026, and static-php-cli only looks for 2022 or 2019, so its doctor check
    # fails before anything is built.
    runs-on: windows-2022
    steps:
      - name: Clone static-php-cli
        run: |
          git clone --depth 1 --branch ${{ env.SPC_VERSION }} https://github.com/crazywhalecc/static-php-cli.git spc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: curl, openssl, mbstring

      - name: Install dependencies
        run: |
          cd spc
          composer install --no-dev --classmap-authoritative

      - name: Setup build environment
        run: |
          cd spc
          ./bin/spc doctor

      # Note: Windows doesn't support pcntl and posix extensions.
      # readline uses libedit in static-php-cli, which requires ncurses (not supported on Windows).
      - name: Download sources
        run: |
          cd spc
          $extensions = $env:EXTENSIONS -replace 'pcntl,?' -replace 'posix,?' -replace 'readline,?' -replace ',,',','
          $extensions = $extensions.Trim(',')
          ./bin/spc download --with-php=${{ needs.resolve-version.outputs.php_version }} --for-extensions="$extensions" --without-suggestions --no-alt ${{ inputs.debug && '--debug' || '' }}

      - name: Build PHP
        run: |
          cd spc
          $extensions = $env:EXTENSIONS -replace 'pcntl,?' -replace 'posix,?' -replace 'readline,?' -replace ',,',','
          $extensions = $extensions.Trim(',')
          ./bin/spc build "$extensions" --build-cli ${{ inputs.debug && '--debug' || '' }}

      # The CLI depends on the SSL backend: it relies on Schannel to verify
      # certificates with Windows, using its certificate store and its
      # distrust and revocation lists.
      - name: Check the SSL backend
        run: |
          $curl = & ./spc/buildroot/bin/php.exe -n -r "echo curl_version()['ssl_version'];"
          Write-Host "curl: $curl"
          if ($curl -ne 'Schannel') {
            throw "expected curl to be built against Schannel, got '$curl'"
          }

      # Collects the binary, and the version of each source in the build,
      # which check-updates.yml compares with the latest upstream versions.
      # On Linux, Docker creates the build directory as root.
      - name: Collect build output
        shell: bash
        run: |
          mkdir out
          cp spc/buildroot/bin/php.exe out/
          jq 'with_entries(select(.value.lock_as == 1 and .value.source_type == "archive" and .key != "frankenphp") | .value = .value.filename)' \
            spc/downloads/.lock.json | tee out/sources.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ needs.resolve-version.outputs.php_version }}-windows-amd64
          path: out/
          retention-days: 1

  # Create GitHub release with all binaries
  create-release:
    name: Create Release
    needs:
      - resolve-version
      - build-linux-amd64
      - build-linux-arm64
      - build-macos-arm64
      - build-macos-amd64
      - build-windows-amd64
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    permissions:
      contents: write
    env:
      PHP_VERSION: ${{ needs.resolve-version.outputs.php_version }}
    steps:
      # Each build gets a new tag (php-X.Y.Z-N), so that released binaries
      # never change.
      - name: Choose the release tag
        id: tag
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | sed -nE "s/^php-${PHP_VERSION//./\\.}-([0-9]+)$/\1/p" | sort -n | tail -n 1)
          build=$(( ${last:-0} + 1 ))
          echo "Release tag: php-${PHP_VERSION}-${build}"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=php-${PHP_VERSION}-${build}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux x86_64
          cp artifacts/php-${PHP_VERSION}-linux-amd64/php \
             release/php-${PHP_VERSION}-linux-amd64
          chmod +x release/php-${PHP_VERSION}-linux-amd64

          # Linux ARM64
          cp artifacts/php-${PHP_VERSION}-linux-arm64/php \
             release/php-${PHP_VERSION}-linux-arm64
          chmod +x release/php-${PHP_VERSION}-linux-arm64

          # macOS ARM64
          cp artifacts/php-${PHP_VERSION}-darwin-arm64/php \
             release/php-${PHP_VERSION}-darwin-arm64
          chmod +x release/php-${PHP_VERSION}-darwin-arm64

          # macOS x86_64
          cp artifacts/php-${PHP_VERSION}-darwin-amd64/php \
             release/php-${PHP_VERSION}-darwin-amd64
          chmod +x release/php-${PHP_VERSION}-darwin-amd64

          # Windows x64
          cp artifacts/php-${PHP_VERSION}-windows-amd64/php.exe \
             release/php-${PHP_VERSION}-windows-amd64.exe

          # Source versions, by platform
          for platform in linux-amd64 linux-arm64 darwin-arm64 darwin-amd64 windows-amd64; do
            jq --arg platform "$platform" '{($platform): .}' "artifacts/php-${PHP_VERSION}-${platform}/sources.json"
          done | jq -s add > release/sources.json
          cat release/sources.json

          # Generate checksums
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Fails if another build created the same tag in the meantime.
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          cat > notes.md <<EOF
          PHP ${PHP_VERSION} static binaries for the Upsun CLI.

          ## Included Extensions

          ${EXTENSIONS}

          Note: \`pcntl\`, \`posix\`, and \`readline\` are not available on Windows.

          ## Build Details

          - Built with [static-php-cli](https://github.com/crazywhalecc/static-php-cli) v${SPC_VERSION}
          - All binaries are statically linked (no external dependencies)
          - Linux builds use musl libc for maximum portability
          - \`sources.json\` lists the source archives used on each platform

          ## Verification

          Download \`SHA256SUMS.txt\` and verify:
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --title "PHP ${PHP_VERSION} (build ${BUILD})" --notes-file notes.md
